# Rate limit: 2 requests/s with a burst of 4, then 429.
#   for i in $(seq 10); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/rate-limit; done
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: demo
spec:
  rateLimit:
    average: 2
    period: 1s
    burst: 4
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rate-limit
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/rate-limit`)
      kind: Rule
      middlewares:
        - name: rate-limit
      services:
        - name: whoami
          port: 80
