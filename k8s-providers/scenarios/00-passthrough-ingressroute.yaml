apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/passthrough`) && Query(`route`, `ingressroute`)
      kind: Rule
      middlewares:
        - name: add-headers-ingressroute
      services:
        - name: whoami
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-ingressroute
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: ingressroute
