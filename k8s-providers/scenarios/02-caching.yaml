# HTTP cache (Hub): first call MISS, repeats HIT for 60s.
#   curl -si http://localhost:8080/cache | grep -i x-cache-status
#
# whoami sends no Cache-Control, so cacheable-for-60s adds one. Middlewares
# see the response in reverse order: cacheable-for-60s sets the header
# before the cache looks at it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache
  namespace: demo
spec:
  plugin:
    httpCache:
      maxTtl: 600
      store:
        memory:
          limit: 64Mi
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cacheable-for-60s
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      Cache-Control: public, max-age=60
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cache
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/cache`)
      kind: Rule
      middlewares:
        - name: cache
        - name: cacheable-for-60s
      services:
        - name: whoami
          port: 80
