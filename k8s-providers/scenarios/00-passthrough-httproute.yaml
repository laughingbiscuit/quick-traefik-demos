apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /passthrough
          queryParams:
            - type: Exact
              name: route
              value: httproute
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: add-headers-httproute
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-httproute
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: httproute
