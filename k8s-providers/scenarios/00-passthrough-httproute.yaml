# Passthrough, version 3: a Gateway API HTTPRoute, the vendor-neutral standard.
# Traefik middlewares plug in as ExtensionRef filters.
#   curl -i 'http://localhost:8080/passthrough?route=httproute'
# Step 1 - Entrypoint: the Gateway's "web" listener, set in ../stack/00-traefik-hub.yaml

# Step 2 - Router
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /passthrough
          queryParams:
            - type: Exact
              name: route
              value: httproute
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: add-headers-httproute
      backendRefs:               # Step 4 - Service: the whoami Service (../stack/01-whoami.yaml)
        - name: whoami
          port: 80
---
# Step 3 - Middleware: X-Route names the route that answered (tests/00-passthrough.hurl)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-httproute
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: httproute
