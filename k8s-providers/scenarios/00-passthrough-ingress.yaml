# Passthrough, version 1: a plain Kubernetes Ingress. Traefik options go in
# annotations, so mistakes only show up at run time.
#   curl -i http://localhost:8080/passthrough
# Step 1 - Entrypoint: "web", set in ../stack/00-traefik-hub.yaml

# Step 2 - Router
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: demo-add-headers-ingress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /passthrough   # an Ingress can't match on the query string
            pathType: Prefix
            backend:
              service:           # Step 4 - Service: the whoami Service (../stack/01-whoami.yaml)
                name: whoami
                port:
                  number: 80
---
# Step 3 - Middleware: X-Route names the route that answered (tests/00-passthrough.hurl)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-ingress
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: ingress
