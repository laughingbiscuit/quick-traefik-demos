# Traefik gets its own certificate for whoami.acme.test from step-ca over ACME, and renews it by itself.
# The resolver "step" is install config: k8s-providers/stack/00-traefik-hub.yaml. step-ca validates on this
# cluster's :80. The name sits outside the wildcard (*.demo.test) on purpose: Traefik skips ACME for
# any name a certificate it already has covers. The VM can't run this: only one gateway can own :80 and :443.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-acme
  namespace: demo
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`whoami.acme.test`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls:
    certResolver: step
