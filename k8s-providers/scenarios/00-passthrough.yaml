###
# Step 2 Router 
###

# Version 1 - Kube Ingress with annotations with run-time validation

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: demo-add-forwarded-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /passthrough # note - no query param support!
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
---

# Version 2 - Traefik Ingress CRD with deploy-time validation

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/passthrough`) && Query(`key`, `route=ingressroute`)
      kind: Rule
      services:
        - name: whoami
          port: 80
---

# Version 3 - Gateway API Spec

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /passthrough
          queryParams:
            - type: Exact
              name: route
              value: "httproute"
      backendRefs:
        - name: whoami
          port: 80
---

###
# Step 3 - Middleware
###

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-forwarded-headers
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Demo: "true"
---

###
# Step 4 - Service
###

apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector: { app: whoami }
  ports: [{ port: 80 }]