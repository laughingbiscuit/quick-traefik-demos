###
# Step 2 - Router
###

# Version 1 - Kube Ingress with annotations with run-time validation

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: demo-add-headers-ingress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /passthrough # note - no query param support!
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
---

# Version 2 - Traefik Ingress CRD with deploy-time validation

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/passthrough`) && Query(`route`, `ingressroute`)
      kind: Rule
      middlewares:
        - name: add-headers-ingressroute
      services:
        - name: whoami
          port: 80
---

# Version 3 - Gateway API Spec

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: demo
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /passthrough
          queryParams:
            - type: Exact
              name: route
              value: "httproute"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: add-headers-httproute
      backendRefs:
        - name: whoami
          port: 80
---

###
# Step 3 - Middleware
###

# One per route: X-Route names the route that answered, so tests/00-passthrough.hurl
# can tell them apart (on the VM, the single file router answers "file").
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-ingress
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: ingress
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-ingressroute
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: ingressroute
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-headers-httproute
  namespace: demo
spec:
  headers:
    customResponseHeaders:
      X-Route: httproute
---

###
# Step 4 - Service
###

apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector: { app: whoami }
  ports: [{ port: 80 }]