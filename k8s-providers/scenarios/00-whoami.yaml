# Base route: everything goes to whoami.
#   curl http://localhost:8080/
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: demo
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: whoami
          port: 80
