# Traefik Hub via Flux. The licence Secret (traefik-hub-license, key "token")
# is created by k3s-bootstrap.sh so it never lands in Git.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 41.7.1
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    hub:
      token: traefik-hub-license   # Secret name; also switches the image to ghcr.io/traefik/traefik-hub
    image:
      tag: v3.21.2                 # only the tag: setting image.repository too gives ghcr.io/ghcr.io/...
    # Step 1 - Entrypoint: "web", explicit: container port 8000, exposed as :80 by the k3d load balancer.
    ports:
      web:
        port: 8000
        exposedPort: 80
    gateway:
      listeners:
        web:
          port: 8000               # must match ports.web.port
          namespacePolicy:
            from: All              # let HTTPRoutes in the demo namespace attach
    # Gateway API: needs the CRDs that k3s-bootstrap.sh installs before Flux.
    providers:
      kubernetesGateway:
        enabled: true
    # Base route: GET / returns 200 OK (ping@internal). Used by the bootstrap readiness check.
    ingressRoute:
      healthcheck:
        enabled: true
        entryPoints: [web]
        matchRule: Path(`/`)
