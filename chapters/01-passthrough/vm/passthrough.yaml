http:
  routers:
    whoami:
      rule: PathPrefix(`/passthrough`) && Query(`route`, `file`)
      entryPoints: [web]
      middlewares: [addHeaders]
      service: whoami-passthrough
  middlewares:
    addHeaders:
      headers:
        customResponseHeaders:
          X-Demo-Route: file

  services:
    whoami-passthrough:
      loadBalancer:
        servers:
          - url: http://localhost:9500
