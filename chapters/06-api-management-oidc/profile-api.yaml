# An API behind the usual token check. The portal's app calls it with the access token the gateway forwarded after login.
# The application is the Keycloak client the person logged in through ("traefik"); a role claim decides who may call.
apiVersion: hub.traefik.io/v1alpha1
kind: APIAuth
metadata: {name: portal-jwt, namespace: demo}
spec:
  isDefault: false
  jwt:
    appIdClaim: azp
    trustedIssuers:
      - issuer: http://localhost:8180/realms/demo
        jwksUrl: https://host.k3d.internal:8543/realms/demo/protocol/openid-connect/certs   # Hub fetches keys over HTTPS only
    clientConfig:
      tls:
        insecureSkipVerify: true   # lab only: Keycloak's certificate here is self-signed
---
apiVersion: hub.traefik.io/v1alpha1
kind: API
metadata: {name: profile, namespace: demo}
spec:
  title: Profile
  apiAuths: [{name: portal-jwt}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: profile
  namespace: demo
  annotations: {hub.traefik.io/api: profile}
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/profile`)
      kind: Rule
      services: [{name: portal, port: 80}]
---
apiVersion: hub.traefik.io/v1alpha1
kind: APIPlan
metadata: {name: portal-plan, namespace: demo}
spec: {title: Portal}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: portal-app, namespace: demo}
spec: {appId: traefik, owner: portal}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: profile-admins, namespace: demo}
spec:
  apiPlan: {name: portal-plan}
  apis: [{name: profile}]
  managedApplications: [{name: portal-app}]
  claims: "Contains(`realm_access.roles`, `admin`)"
