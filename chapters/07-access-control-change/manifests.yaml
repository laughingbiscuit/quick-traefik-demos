# One more subscription: Partner A may now call Payments. The client, its token and the identity provider are as they were: only the
# gateway's own record changes. It builds on the chapter before, which defines the plan, the Payments API and Partner A. Turn this
# chapter off and Flux removes the subscription again.
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: payments-access-partner-a, namespace: demo}
spec:
  apiPlan: {name: standard}
  apis: [{name: payments}]
  managedApplications: [{name: partner-a}]
  claims: "Contains(`aud`, `payments-api`)"
