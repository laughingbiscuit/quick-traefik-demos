# The gateway's own record of who the clients are, and who may use what. The identity provider knows nothing of this:
# every client has the same broad token, and this is what makes the difference. A subscription also checks the token's
# audience, so a token meant for another service is no use here even from a client that is subscribed.
apiVersion: hub.traefik.io/v1alpha1
kind: APIPlan
metadata: {name: standard, namespace: demo}
spec:
  title: Standard
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: partner-a, namespace: demo}
spec: {appId: partner-a, owner: partners}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: partner-b, namespace: demo}
spec: {appId: partner-b, owner: partners}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: internal, namespace: demo}
spec: {appId: internal, owner: platform}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: orders-access, namespace: demo}
spec:
  apiPlan: {name: standard}
  apis: [{name: orders}]
  managedApplications: [{name: partner-a}, {name: internal}]
  claims: "Contains(`aud`, `orders-api`)"
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: payments-access, namespace: demo}
spec:
  apiPlan: {name: standard}
  apis: [{name: payments}]
  managedApplications: [{name: partner-b}, {name: internal}]
  claims: "Contains(`aud`, `payments-api`)"
