# How the gateway checks a token: signed by the partners realm in Keycloak (its keys come from the JWKS URL), issued
# by that realm, and the claim "azp" says which client is calling. Any OAuth2 provider that issues JWTs works the same
# way: change the issuer, the JWKS URL and the claim.
apiVersion: hub.traefik.io/v1alpha1
kind: APIAuth
metadata:
  name: partners-jwt
  namespace: demo
spec:
  isDefault: false
  jwt:
    appIdClaim: azp   # the client's identity: matched to a ManagedApplication's appId
    trustedIssuers:
      - issuer: http://localhost:8180/realms/partners   # what Keycloak puts in every token
        # Keycloak, through the host. Hub only fetches keys over HTTPS, and Keycloak's certificate here is self-signed
        jwksUrl: https://host.k3d.internal:8543/realms/partners/protocol/openid-connect/certs
    forwardHeaders:
      X-Client-Id: azp   # the backend gets the verified client from the token, not from whatever the caller sent
    clientConfig:
      tls:
        insecureSkipVerify: true   # lab only: in production the issuer has a certificate Hub trusts
