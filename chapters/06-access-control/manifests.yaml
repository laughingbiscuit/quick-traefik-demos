# Two backends, Orders and Payments. whoami answers on any path and echoes what it received, so a test can see
# exactly what the gateway forwarded.
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--name", "orders-api"]
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: demo}
spec:
  selector: {app: orders}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--name", "payments-api"]
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: payments, namespace: demo}
spec:
  selector: {app: payments}
  ports: [{port: 80}]
---
# How the gateway checks a token: signed by the demo realm in Keycloak (its keys come from the JWKS URL), issued
# by that realm, and the claim "azp" says which client is calling. Any OAuth2 provider that issues JWTs works the same
# way: change the issuer, the JWKS URL and the claim.
apiVersion: hub.traefik.io/v1alpha1
kind: APIAuth
metadata:
  name: partners-jwt
  namespace: demo
spec:
  isDefault: false
  jwt:
    appIdClaim: azp   # the client's identity: matched to a ManagedApplication's appId
    trustedIssuers:
      - issuer: http://localhost:8180/realms/demo   # what Keycloak puts in every token
        # Keycloak, through the host. Hub only fetches keys over HTTPS, and Keycloak's certificate here is self-signed
        jwksUrl: https://host.k3d.internal:8543/realms/demo/protocol/openid-connect/certs
    forwardHeaders:
      X-Client-Id: azp   # the backend gets the verified client from the token, not from whatever the caller sent
    clientConfig:
      tls:
        insecureSkipVerify: true   # lab only: in production the issuer has a certificate Hub trusts
---
# Two APIs, each behind a route that carries the API's name. An API with no subscriber for the caller is a 403.
apiVersion: hub.traefik.io/v1alpha1
kind: API
metadata: {name: orders, namespace: demo}
spec:
  title: Orders
  apiAuths:
    - name: partners-jwt
---
apiVersion: hub.traefik.io/v1alpha1
kind: API
metadata: {name: payments, namespace: demo}
spec:
  title: Payments
  apiAuths:
    - name: partners-jwt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orders
  namespace: demo
  annotations:
    hub.traefik.io/api: orders
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/orders`)
      kind: Rule
      services:
        - name: orders
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: payments
  namespace: demo
  annotations:
    hub.traefik.io/api: payments
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/payments`)
      kind: Rule
      services:
        - name: payments
          port: 80
---
# The gateway's own record of who the clients are, and who may use what. The identity provider knows nothing of this:
# every client has the same broad token, and this is what makes the difference. A subscription also checks the token's
# audience, so a token meant for another service is no use here even from a client that is subscribed.
apiVersion: hub.traefik.io/v1alpha1
kind: APIPlan
metadata: {name: standard, namespace: demo}
spec:
  title: Standard
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: partner-a, namespace: demo}
spec: {appId: partner-a, owner: partners}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: partner-b, namespace: demo}
spec: {appId: partner-b, owner: partners}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedApplication
metadata: {name: internal, namespace: demo}
spec: {appId: internal, owner: platform}
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: orders-access, namespace: demo}
spec:
  apiPlan: {name: standard}
  apis: [{name: orders}]
  managedApplications: [{name: partner-a}, {name: internal}]
  claims: "Contains(`aud`, `orders-api`)"
---
apiVersion: hub.traefik.io/v1alpha1
kind: ManagedSubscription
metadata: {name: payments-access, namespace: demo}
spec:
  apiPlan: {name: standard}
  apis: [{name: payments}]
  managedApplications: [{name: partner-b}, {name: internal}]
  claims: "Contains(`aud`, `payments-api`)"
