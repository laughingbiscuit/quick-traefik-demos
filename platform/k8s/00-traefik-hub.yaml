# Traefik Hub via Flux. The licence Secret (traefik-hub-license, key "token")
# is created by `./demo.sh k8s` so it never lands in Git.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 41.7.1
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    hub:
      token: traefik-hub-license   # Secret name; also switches the image to ghcr.io/traefik/traefik-hub
      apimanagement:
        enabled: true              # API management: APIs, plans, managed applications and subscriptions. Needs a licence that includes it
    image:
      tag: v3.21.2                 # only the tag: setting image.repository too gives ghcr.io/ghcr.io/...
    # Step 1 - Entrypoint: "web", explicit: container port 8000, exposed as :80 by the k3d load balancer.
    ports:
      web:
        port: 8000
        exposedPort: 80
      # The dashboard and API entrypoint, exposed on :8082 for the demo. It is the only dashboard in the lab (the VM
      # has none): it shows what every provider gave this Traefik. `./demo.sh export` reads /api/rawdata here.
      # Unauthenticated, so lab-only: never expose this on a real cluster.
      traefik:
        expose:
          default: true
        exposedPort: 8082
    ingressRoute:
      dashboard:
        enabled: true
    # Step 1b - websecure keeps the chart defaults (container port 8443, exposed as :443, TLS on).
    # There is no pre-issued certificate: every name is served with a certificate Traefik got over ACME.
    # ACME from step-ca: Traefik gets its own certificates and renews them, see chapters/02-proxy/acme.yaml.
    # step-ca validates on this cluster's :80 (the web entrypoint). Its root CA is the Secret
    # step-ca-root, created by `./demo.sh k8s`. Certificates last 24h, so Traefik renews them in
    # their last 6 hours, checking every 10 minutes. Without persistence the account and
    # certificates live in the pod's volume: a new pod simply asks again.
    certificatesResolvers:
      step:
        acme:
          email: demo@example.com
          caServer: https://host.k3d.internal:9000/acme/acme/directory
          caCertificates: [/step-ca/ca.pem]
          certificatesDuration: 24
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    volumes:
      - name: step-ca-root
        mountPath: /step-ca
        type: secret
    gateway:
      listeners:
        web:
          port: 8000
          namespacePolicy:
            from: All
    # Providers: each watches its own source and Traefik merges them into one configuration, one dashboard.
    # Ingress and IngressRoute are on by default, Gateway API is switched on here, and so is the file provider:
    # one instance, four sources, told apart in the dashboard by their suffix (@kubernetes, @kubernetescrd,
    # @kubernetesgateway, @file). Chapter 1's file route is below: the VM runs the same YAML from a file, with
    # its own backend (chapters/01-passthrough/vm/passthrough.yaml).
    providers:
      kubernetesGateway:
        enabled: true
      file:
        enabled: true
        content:
          http:
            routers:
              whoami:
                rule: PathPrefix(`/passthrough`) && Query(`route`, `file`)
                entryPoints: [web]
                middlewares: [addHeaders]
                service: whoami-passthrough
            middlewares:
              addHeaders:
                headers:
                  customResponseHeaders:
                    X-Demo-Route: file
            services:
              whoami-passthrough:
                loadBalancer:
                  servers:
                    - url: http://whoami.demo.svc.cluster.local:80
