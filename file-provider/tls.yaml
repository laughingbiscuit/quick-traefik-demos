# Default certificate for the websecure entrypoint: a *.test wildcard from step-ca.
# vm-provision.sh puts the files there; they never go through Git. Dynamic, like the dashboard.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/tls.crt
        keyFile: /etc/traefik/certs/tls.key
