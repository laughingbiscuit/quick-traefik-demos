# Dependencies that run in Docker next to Traefik (Keycloak, Redis, ...).
# The sync job applies this with "compose up", so adding a service here
# and pushing installs it. Traefik itself is a binary under systemd, so
# publish ports on 127.0.0.1 and point scenarios at http://localhost:<port>.
services:
  whoami:   # placeholder for a real dependency such as Redis
    image: traefik/whoami:v1.10
    ports:
      - "127.0.0.1:9000:80"
    restart: unless-stopped
