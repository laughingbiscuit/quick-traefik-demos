http:
  routers:
    whoami:
      rule: PathPrefix(`/passthrough`)
      entryPoints: [web]
      middlewares: [addHeaders]
      service: whoami
  middlewares:
    addHeaders:
      headers:
        customResponseHeaders:
          X-Route: file
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://localhost:9000
