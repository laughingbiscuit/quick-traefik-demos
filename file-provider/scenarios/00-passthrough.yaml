# Base route: everything goes to whoami.
#   curl http://localhost:8000/
http:
  routers:
    whoami:
      rule: PathPrefix(`/passthrough`)
      entryPoints: [web]
      middlewares: [addForwardedHeaders]
      service: whoami
  middlewares:
    addForwardedHeaders:
      headers: 
        customResponseHeaders:
          X-Demo: "true"
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://localhost:9000
 