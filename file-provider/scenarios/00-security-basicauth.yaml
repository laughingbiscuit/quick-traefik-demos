      basicAuth:
        users:
          - "demo:$2y$05$pDGGdOguiiYDGuyPrWxJGO0ivQQSEQETNOzMtnpWyHweap4gZB7GW"
  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://localhost:9500
