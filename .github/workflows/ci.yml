# Build both demos, enable every scenario, test them all.
# Needs a HUB_TOKEN repository secret (an online Traefik Hub gateway token).
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
    steps:
      # Full history: `demo.sh sync` pushes a commit on top of HEAD, and Gitea rejects shallow pushes
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install k3d, flux and hurl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
          curl -s https://fluxcd.io/install.sh | sudo FLUX_VERSION=2.9.6 bash
          curl -sLO https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo apt-get install -y ./hurl_8.0.1_amd64.deb

      - name: Gitea
        run: ./demo.sh git

      - name: k8s-providers demo (k3d + Flux)
        run: ./demo.sh k8s

      # No Lima here: the runner is the VM
      - name: file-provider demo
        run: |
          sudo HUB_TOKEN="$HUB_TOKEN" GITOPS_REPO=http://demo:Passw0rd%21@localhost:3000/demo/gitops.git sh file-provider/vm-provision.sh
          timeout 300 sh -c 'until curl -sf http://localhost:8001/ping; do sleep 2; done'

      - name: Enable every scenario
        run: |
          sed -i 's/^# \([0-9]\)/\1/' file-provider/scenarios/enabled.txt
          sed -i 's/^# - /  - /' k8s-providers/scenarios/kustomization.yaml
          ./demo.sh sync

      - name: Test both demos
        run: ./demo.sh test

      - name: Diagnostics
        if: failure()
        run: |
          sudo systemctl status traefik gitops-sync --no-pager || true
          sudo journalctl -u traefik --no-pager -n 60 || true
          sudo journalctl -u gitops-sync --no-pager -n 20 || true
          sudo cat /etc/traefik/traefik-static.yaml || true
          sudo ss -ltnp || true
          export KUBECONFIG=$(k3d kubeconfig write k8s-demo 2>/dev/null) || true
          flux get all -A || true
          kubectl get pods -A || true
          kubectl -n traefik logs deploy/traefik --tail=40 || true
