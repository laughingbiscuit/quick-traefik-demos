# demos: build both demos, turn every chapter on, test them all, export k3d's config to the VM and test that too,
#        then put the VM back on its own config. Needs a HUB_TOKEN repository secret (an online Traefik Hub gateway token).
# deck:  build the workshop deck, in full and for one customer. The Pages workflow only runs on main.
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  demos:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
    steps:
      # Full history: `demo.sh sync` pushes a commit on top of HEAD, and Gitea rejects shallow pushes
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install k3d, flux and hurl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash
          curl -s https://fluxcd.io/install.sh | sudo FLUX_VERSION=2.9.6 bash
          # hurl's .deb and tarball need libxml2.so.2, which Ubuntu 26.04 no longer has (libxml2-16 is .so.16): run the
          # official image, a static musl build, behind a `hurl` command. Host network, and the working directory
          # at the same path inside, so demo.sh's relative paths and localhost URLs work unchanged
          sudo tee /usr/local/bin/hurl > /dev/null <<'EOF'
          #!/bin/sh
          exec docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" ghcr.io/orange-opensource/hurl:8.0.1 "$@"
          EOF
          sudo chmod +x /usr/local/bin/hurl
          hurl --version

      - name: Gitea
        run: ./demo.sh git

      - name: Shared services
        run: ./demo.sh shared

      - name: k3d demo (Flux)
        run: ./demo.sh k8s

      # No Lima here: the runner is the VM
      - name: VM demo
        run: |
          sudo HUB_TOKEN="$HUB_TOKEN" GITOPS_REPO=http://demo:Password123@localhost:3000/demo/gitops.git sh platform/vm/vm-provision.sh
          timeout 300 sh -c 'until curl -sf http://localhost:8001/ping; do sleep 2; done'

      - name: Turn every chapter on
        run: ./demo.sh chapter all

      # VM_LOCAL=1: the runner is the VM, so the VM steps use sudo instead of Lima
      - name: Test both demos
        run: VM_LOCAL=1 ./demo.sh test

      - name: Export k3d's config to the VM and test it there
        run: VM_LOCAL=1 ./demo.sh export

      - name: Put the VM back on its own config and test it
        run: |
          VM_LOCAL=1 ./demo.sh vm-reset
          VM_LOCAL=1 ./demo.sh test

      - name: Diagnostics
        if: failure()
        run: |
          sudo systemctl status traefik gitops-sync --no-pager || true
          sudo journalctl -u traefik --no-pager -n 60 || true
          sudo journalctl -u gitops-sync --no-pager -n 20 || true
          sudo cat /etc/traefik/traefik-static.yaml || true
          sudo ss -ltnp || true
          docker compose -p shared -f shared/compose.yaml logs --tail 30 || true
          export KUBECONFIG=$(k3d kubeconfig write k8s-demo 2>/dev/null) || true
          flux get all -A || true
          kubectl get pods -A || true
          kubectl -n traefik logs deploy/traefik --tail=40 || true

  deck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # yq is already on GitHub's Ubuntu runners
      - name: Install m4, pandoc and mdp2html
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq m4 pandoc
          sudo curl -sfL -o /usr/local/bin/mdp2html https://github.com/laughingbiscuit/mdp2html/releases/download/v0.1/mdp2html.sh
          sudo chmod +x /usr/local/bin/mdp2html

      - name: Build the full deck
        run: |
          ./docs.sh
          grep -q '^# Passthrough' _site/deck.md
          # Slides are assembled per customer, so none may say "chapter" or lean on another chapter's slides
          # (the word may appear in a path like chapters/04-api-access-control/, which links a slide to its code)
          ! grep -i 'chapter' _site/deck.md | grep -qv 'chapters/'

      - name: Build a deck for one customer, in the order asked for
        run: |
          ./docs.sh api-gateway proxy
          api=$(grep -n '^# API gateway' _site/deck.md | cut -d: -f1)
          proxy=$(grep -n '^# Proxy' _site/deck.md | cut -d: -f1)
          test -n "$api" && test -n "$proxy" && test "$api" -lt "$proxy"
          ! grep -q '^# Passthrough' _site/deck.md

